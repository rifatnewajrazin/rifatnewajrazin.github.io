<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title id="pageTitle">Loading… — Rifat Newaj Razin</title>
<meta name="description" content="Case study — Rifat Newaj Razin, graphic designer in Dhaka." />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- identical to index.html's font set — this <head> never reloads once
     client-side navigation swaps <main>, so both templates must request the
     same fonts up front regardless of which one loads first (this page
     doesn't use Prompt itself, but the homepage's statement text does). -->
<link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Prompt:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<style>
  .case-hero{padding-top:140px;padding-bottom:8vh}
  .case-back{font-size:13px;color:var(--ink-soft);display:inline-block;margin-bottom:40px}
  .case-back:hover{color:var(--ink)}
  .case-title{
    font-family:var(--display);font-weight:400;
    font-size:clamp(44px,10vw,120px);line-height:.94;letter-spacing:-.03em;
    text-transform:uppercase;
  }
  .case-meta{display:flex;flex-wrap:wrap;gap:40px;margin-top:44px;border-top:1px solid var(--ink);padding-top:22px}
  .case-meta div{min-width:120px}
  .case-meta dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
  .case-meta dd{font-family:var(--display);font-weight:400;font-size:17px;margin-top:6px}
  .case-body{max-width:640px;padding-bottom:6vh}
  .case-body h3{font-family:var(--display);font-weight:400;font-size:22px;margin:48px 0 14px;letter-spacing:-.01em}
  .case-body p{color:var(--ink-soft);margin-bottom:16px}
  .shot{width:100%;border-radius:6px;margin:10px 0 40px;overflow:hidden}
  /* real photos show at their own natural aspect ratio — never cropped.
     The fixed-ratio gradient boxes are only for the no-image placeholder
     state (:not(:has(img))), so they still look intentional while empty. */
  .shot:not(:has(img)){aspect-ratio:16/10}
  .shot img{width:100%;height:auto;display:block;border-radius:inherit;cursor:pointer;transition:opacity .2s ease}
  .shot img:hover{opacity:.92}
  .shot.a{background:linear-gradient(135deg,#2f43ff,#9db0ff)}
  .shot.b{background:linear-gradient(135deg,#d1602f,#f0b99e)}
  .shot.c{background:linear-gradient(135deg,#17161a,#5b5850)}
  .shot-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .shot-row .shot:not(:has(img)){aspect-ratio:4/5}
  .next{border-top:1px solid var(--ink);padding:40px 0 64px;display:flex;justify-content:space-between;align-items:baseline}
  .next a{font-family:var(--display);font-weight:400;font-size:clamp(20px,3vw,34px);letter-spacing:-.02em}
  .next a:hover{color:var(--accent)}
  .case-body p:empty,.case-body h3:has(+ p:empty){display:none}
  @media(max-width:820px){.shot-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<!-- ============ PAGE TRANSITION ============ (see main.js) -->
<div class="page-transition" id="pageTransition" aria-hidden="true"></div>

<header class="nav" id="nav">
  <a href="/redesign/#top" class="mark">RNR<span class="dot">.</span></a>
  <nav class="nav-links">
    <a href="/redesign/#work">Work</a>
    <a href="/redesign/#about">About</a>
    <a href="/redesign/#contact">Contact</a>
  </nav>
</header>

<main>
  <section class="case-hero">
    <a href="/redesign/#work" class="case-back" data-anim>← Back to work</a>
    <h1 class="case-title" data-anim id="caseTitle">—</h1>
    <dl class="case-meta" data-anim>
      <div><dt>Year</dt><dd id="metaYear">—</dd></div>
      <div><dt>Role</dt><dd id="metaRole">—</dd></div>
      <div><dt>Deliverables</dt><dd id="metaDeliverables">—</dd></div>
      <div><dt>Client</dt><dd id="metaClient">—</dd></div>
    </dl>
  </section>

  <section data-anim><div class="shot a" id="shotCover"></div></section>

  <section class="case-body" data-anim>
    <h3>The brief</h3>
    <div id="briefText"></div>

    <h3>The approach</h3>
    <div id="approachText"></div>
  </section>

  <section data-anim><div class="shot-row"><div class="shot b" id="shotB"></div><div class="shot c" id="shotC"></div></div></section>

  <section class="case-body" data-anim>
    <h3>The outcome</h3>
    <div id="outcomeText"></div>
  </section>

  <section class="next" data-anim>
    <span style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)">Next project</span>
    <a href="#" id="nextProjectLink">—</a>
  </section>
</main>

<footer class="foot">
  <span>© 2026 Rifat Newaj Razin</span>
  <span>Dhaka, Bangladesh</span>
</footer>

<!-- ============ LIGHTBOX ============ click any photo to view it full-size
     (wired in main.js, so it survives client-side navigation into this view) -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
  <img id="lightboxImg" src="" alt="" />
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
<script src="../main.js"></script>
</body>
</html>
