<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title id="pageTitle">Loading… — Rifat Newaj Razin</title>
<meta name="description" content="Case study — Rifat Newaj Razin, graphic designer in Dhaka." />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<style>
  .case-hero{padding-top:140px;padding-bottom:8vh}
  .case-back{font-size:13px;color:var(--ink-soft);display:inline-block;margin-bottom:40px}
  .case-back:hover{color:var(--ink)}
  .case-title{
    font-family:var(--display);font-weight:400;
    font-size:clamp(44px,10vw,120px);line-height:.94;letter-spacing:-.03em;
    text-transform:uppercase;
  }
  .case-meta{display:flex;flex-wrap:wrap;gap:40px;margin-top:44px;border-top:1px solid var(--ink);padding-top:22px}
  .case-meta div{min-width:120px}
  .case-meta dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
  .case-meta dd{font-family:var(--display);font-weight:400;font-size:17px;margin-top:6px}
  .case-body{max-width:640px;padding-bottom:6vh}
  .case-body h3{font-family:var(--display);font-weight:400;font-size:22px;margin:48px 0 14px;letter-spacing:-.01em}
  .case-body p{color:var(--ink-soft);margin-bottom:16px}
  .shot{width:100%;border-radius:6px;margin:10px 0 40px;overflow:hidden}
  /* real photos show at their own natural aspect ratio — never cropped.
     The fixed-ratio gradient boxes are only for the no-image placeholder
     state (:not(:has(img))), so they still look intentional while empty. */
  .shot:not(:has(img)){aspect-ratio:16/10}
  .shot img{width:100%;height:auto;display:block;border-radius:inherit;cursor:pointer;transition:opacity .2s ease}
  .shot img:hover{opacity:.92}
  .shot.a{background:linear-gradient(135deg,#2f43ff,#9db0ff)}
  .shot.b{background:linear-gradient(135deg,#d1602f,#f0b99e)}
  .shot.c{background:linear-gradient(135deg,#17161a,#5b5850)}
  .shot-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .shot-row .shot:not(:has(img)){aspect-ratio:4/5}
  .next{border-top:1px solid var(--ink);padding:36px 0 10vh;display:flex;justify-content:space-between;align-items:baseline}
  .next a{font-family:var(--display);font-weight:400;font-size:clamp(20px,3vw,34px);letter-spacing:-.02em}
  .next a:hover{color:var(--accent)}
  .case-body p:empty,.case-body h3:has(+ p:empty){display:none}
  @media(max-width:820px){.shot-row{grid-template-columns:1fr}}

  /* ---------- lightbox (click a photo to view it full-size) ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:200;background:rgba(23,22,26,.94);
    display:flex;align-items:center;justify-content:center;padding:5vh 5vw;
    opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s;
  }
  .lightbox.open{opacity:1;visibility:visible;transition:opacity .35s ease}
  .lightbox img{
    max-width:100%;max-height:100%;border-radius:4px;display:block;
    transform:scale(.96);transition:transform .35s cubic-bezier(.2,.7,.2,1);
    box-shadow:0 30px 80px rgba(0,0,0,.45);
  }
  .lightbox.open img{transform:scale(1)}
  .lightbox-close{
    position:absolute;top:22px;right:26px;width:40px;height:40px;
    border:none;background:none;color:var(--paper);font-size:32px;line-height:1;
    cursor:pointer;opacity:.75;transition:opacity .2s ease;font-family:var(--display);
  }
  .lightbox-close:hover{opacity:1}
  @media(prefers-reduced-motion:reduce){
    .lightbox,.lightbox img{transition:none}
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<!-- ============ PAGE TRANSITION ============ (see main.js pageTransitions()) -->
<div class="page-transition" id="pageTransition" aria-hidden="true"></div>
<script>try{if(sessionStorage.getItem('rnr-nav')==='1'){document.getElementById('pageTransition').style.transform='translateY(0)'}}catch(e){}</script>

<header class="nav">
  <a href="../index.html" class="mark">RNR<span class="dot">.</span></a>
  <nav class="nav-links">
    <a href="../index.html#work">Work</a>
    <a href="../index.html#about">About</a>
    <a href="../index.html#contact">Contact</a>
  </nav>
</header>

<main>
  <section class="case-hero">
    <a href="../index.html#work" class="case-back" data-anim>← Back to work</a>
    <h1 class="case-title" data-anim id="caseTitle">—</h1>
    <dl class="case-meta" data-anim>
      <div><dt>Year</dt><dd id="metaYear">—</dd></div>
      <div><dt>Role</dt><dd id="metaRole">—</dd></div>
      <div><dt>Deliverables</dt><dd id="metaDeliverables">—</dd></div>
      <div><dt>Client</dt><dd id="metaClient">—</dd></div>
    </dl>
  </section>

  <section data-anim><div class="shot a" id="shotCover"></div></section>

  <section class="case-body" data-anim>
    <h3>The brief</h3>
    <div id="briefText"></div>

    <h3>The approach</h3>
    <div id="approachText"></div>
  </section>

  <section data-anim><div class="shot-row"><div class="shot b" id="shotB"></div><div class="shot c" id="shotC"></div></div></section>

  <section class="case-body" data-anim>
    <h3>The outcome</h3>
    <div id="outcomeText"></div>
  </section>

  <section class="next" data-anim>
    <span style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)">Next project</span>
    <a href="#" id="nextProjectLink">—</a>
  </section>
</main>

<footer class="foot">
  <span>© 2026 Rifat Newaj Razin</span>
  <span>Dhaka, Bangladesh</span>
</footer>

<!-- ============ LIGHTBOX ============ click any photo to view it full-size -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
  <img id="lightboxImg" src="" alt="" />
</div>
<script>
/* Standalone — no GSAP dependency, so a photo can always be opened even if
   the animation libraries fail to load. */
(function () {
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lightboxImg');
  var closeBtn = document.getElementById('lightboxClose');
  if (!lb || !lbImg) return;

  function open(src, alt) {
    lbImg.src = src;
    lbImg.alt = alt || '';
    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function close() {
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  document.addEventListener('click', function (e) {
    var img = e.target.closest && e.target.closest('.shot img');
    if (img) { open(img.src, img.alt); return; }
    if (e.target === lb || e.target === closeBtn) close();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
  });
})();
</script>
<script>
/* Populate this page from data/work.json, matched by the ?slug= in the URL.
   Runs standalone (no GSAP dependency) — the [data-anim] wrappers are
   already in the HTML, so the reveal system in main.js works regardless of
   when this fetch resolves. If the slug isn't found, falls back to the
   first item so the page never renders empty. */
(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function paragraphs(text) {
    return String(text || '').split(/\n\s*\n/).map(function (p) {
      return '<p>' + esc(p.trim()).replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }
  function setShot(el, src, fallbackClass) {
    if (!el) return;
    if (src) { el.innerHTML = '<img src="' + esc(src) + '" alt="">'; el.classList.remove(fallbackClass); }
  }

  var slug = new URLSearchParams(location.search).get('slug');

  fetch('../data/work.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var items = (data && data.items) || [];
      if (!items.length) return;
      var i = items.findIndex(function (it) { return it.slug === slug; });
      if (i === -1) i = 0;
      var item = items[i];
      var next = items[(i + 1) % items.length];

      document.title = item.title + ' — Rifat Newaj Razin';
      document.getElementById('pageTitle').textContent = item.title + ' — Rifat Newaj Razin';
      document.getElementById('caseTitle').textContent = item.title || '';
      document.getElementById('metaYear').textContent = item.year || '—';
      document.getElementById('metaRole').textContent = item.role || '—';
      document.getElementById('metaDeliverables').textContent = item.deliverables || '—';
      document.getElementById('metaClient').textContent = item.client || '—';
      document.getElementById('briefText').innerHTML = paragraphs(item.brief);
      document.getElementById('approachText').innerHTML = paragraphs(item.approach);
      document.getElementById('outcomeText').innerHTML = paragraphs(item.outcome);

      setShot(document.getElementById('shotCover'), item.cover, 'a');
      var gallery = item.gallery || [];
      setShot(document.getElementById('shotB'), gallery[0], 'b');
      setShot(document.getElementById('shotC'), gallery[1], 'c');

      var nextLink = document.getElementById('nextProjectLink');
      nextLink.textContent = (next.title || '') + ' ↗';
      nextLink.href = './case.html?slug=' + encodeURIComponent(next.slug || '');
    })
    .catch(function () { /* static "—" placeholders stay as a safe fallback */ });
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
<script src="../main.js"></script>
</body>
</html>
