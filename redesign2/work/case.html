<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#fdfdfd" />
<title id="pageTitle">Loading… — Rifat Newaj Razin</title>
<meta name="description" content="Case study — Rifat Newaj Razin, graphic designer in Dhaka." />
<meta name="robots" content="noindex, nofollow" />
<!-- Runs before first paint: mark the page JS-ready so [data-anim] blocks
     start hidden (no flash of visible content that then snaps away and
     re-animates on a hard reload), and stop the browser restoring the old
     scroll position. If main.js never boots, reveal everything after 4s. -->
<script>(function(d){try{if('scrollRestoration'in history)history.scrollRestoration='manual'}catch(e){}d.classList.add('js-ready');setTimeout(function(){window.__rnrBooted||d.classList.add('reveal-all')},4000)})(document.documentElement)</script>
<!-- Light by default; only an explicit saved choice flips it to dark. Set
     before first paint so there's no flash. -->
<script>(function(d){d.setAttribute('data-theme','light')})(document.documentElement)</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- identical to index.html's font set — this <head> never reloads once
     client-side navigation swaps <main>, so both templates must request the
     same fonts up front regardless of which one loads first (this page
     doesn't use Prompt itself, but the homepage's statement text does). -->
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,300..700;1,300..600&family=Caveat:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/redesign2/styles.css" />
<!-- Case-view styles now live in ../styles.css (the "case study" block) so
     they are present no matter how the view is reached — a full load of this
     file, or a client-side <main> swap from the homepage that never touches
     this <head>. -->
</head>
<body>

<!-- rough torn-edge filter for the mixed-media skin (styles.css) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="torn"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div class="bg-flow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<!-- ============ PAGE TRANSITION ============ (see main.js) -->
<div class="page-transition" id="pageTransition" aria-hidden="true"></div>

<header class="nav" id="nav">
  <a href="/redesign2/#top" class="mark" aria-label="Home"><svg viewBox="0 0 32 33" aria-hidden="true"><path d="M3 15 Q16 3.5 29 15"/><path d="M6.5 13 V28"/><path d="M25.5 13 V28"/><path d="M21.5 8.5 V4 H24.6 V10.6"/><path class="door" d="M13 28 V19.6 Q16 17 19 19.6 V28"/><path d="M2 28.2 H30"/><path d="M2.6 31 Q16 29 29.4 30.8"/></svg></a>
  <nav class="nav-links">
    <a href="/redesign2/#work">Work</a>
    <a href="/redesign2/#about">About</a>
    <a href="/redesign2/#versions">B-Sides</a>
    <a href="/redesign2/#contact">Contact</a>
  </nav>
</header>

<main>
  <section class="case-hero">
    <a href="/redesign2/#work" class="case-back" data-anim>← Back to work</a>
    <h1 class="case-title" data-anim id="caseTitle">—</h1>
    <dl class="case-meta" data-anim>
      <div><dt>Year</dt><dd id="metaYear">—</dd></div>
      <div><dt>Role</dt><dd id="metaRole">—</dd></div>
      <div><dt>Deliverables</dt><dd id="metaDeliverables">—</dd></div>
      <div><dt>Client</dt><dd id="metaClient">—</dd></div>
    </dl>
  </section>

  <section data-anim><div class="shot a" id="shotCover"></div></section>

  <section class="case-body" data-anim>
    <h3>The brief</h3>
    <div id="briefText"></div>

    <h3>The approach</h3>
    <div id="approachText"></div>
  </section>

  <section data-anim><div class="shot-row"><div class="shot b" id="shotB"></div><div class="shot c" id="shotC"></div></div></section>

  <section class="case-body" data-anim>
    <h3>The outcome</h3>
    <div id="outcomeText"></div>
  </section>

  <section class="next" data-anim>
    <span style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)">Next project</span>
    <a href="#" id="nextProjectLink">—</a>
  </section>
</main>

<footer class="foot">
  <span>© 2026 Rifat Newaj Razin</span>
  <span>Dhaka, Bangladesh</span>
</footer>

<!-- Theme toggle — mirrors index.html so a direct load of this page also
     has it; wired once in main.js. -->
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Toggle theme">
  <svg class="tt-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="tt-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
</button>

<!-- ============ LIGHTBOX ============ click any photo to view it full-size
     (wired in main.js, so it survives client-side navigation into this view) -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
  <img id="lightboxImg" src="" alt="" />
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
<script src="/redesign2/main.js"></script>
</body>
</html>
